<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… — Muhammad Zubir Jamalullail</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1B2D;
      color: #8A9BB5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      text-align: center;
    }
    a { color: #F5A623; }
  </style>
  <script>
    (function () {
      // Prefixes that forward to an external base, preserving any sub-path
      var prefixes = {
        '/github': 'https://github.com/zubir2k',
        '/tech':   'https://zubir.tech'
      };
      var p = window.location.pathname.replace(/\/+$/, '') || '/';
      for (var prefix in prefixes) {
        if (p === prefix || p.indexOf(prefix + '/') === 0) {
          var rest = p.slice(prefix.length); // '', or '/repo-name', or '/repo-name/sub'
          window.location.replace(prefixes[prefix] + rest + window.location.search);
          return;
        }
      }
      if (p !== '/' && p !== '/index.html') {
        window.location.replace('/');
      }
    })();
  </script>

</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/">zubir.is-a.dev</a>…</p>
  </noscript>
</body>
</html>

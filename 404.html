<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… — Muhammad Zubir Jamalullail</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1B2D;
      color: #8A9BB5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      text-align: center;
    }
    a { color: #F5A623; }
  </style>
  <script>
    (function () {
      var paths = {
        '/github': 'https://github.com/zubir2k',
        '/tech':   'https://zubir.tech'
      };
      var p = window.location.pathname.replace(/\/+$/, '') || '/';
      if (paths[p]) {
        window.location.replace(paths[p]);
      } else if (p !== '/' && p !== '/index.html') {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/">zubir.is-a.dev</a>…</p>
  </noscript>
</body>
</html>

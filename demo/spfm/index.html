<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPFM — Home Assistant Card Demo</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon.ico" sizes="32x32" />
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon-192x192.png" />
    <script type="module" src="https://demo.home-assistant.io/embed.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-spfm@main/custom_components/spfm/www/spfm-card.js"
    ></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header { margin-bottom: 1.5rem; }
      .nav { font-size: 0.85rem; margin-bottom: 0.75rem; }
      .brand img { height: 40px; width: auto; display: block; margin-bottom: 0.35rem; }
      header p { margin: 0; opacity: 0.78; font-size: 0.95rem; }
      header a { color: #00a9a5; text-decoration: none; }
      header a:hover { text-decoration: underline; }
      ha-embed-provider {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav"><a href="../">← All Card Demos</a></div>
      <div class="brand">
        <picture>
          <source
            media="(prefers-color-scheme: dark)"
            srcset="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-spfm@main/custom_components/spfm/brand/dark_logo.png"
          />
          <img
            src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-spfm@main/custom_components/spfm/brand/logo.png"
            alt="SPFM"
          />
        </picture>
      </div>
      <p>
        Live interactive preview of
        <a href="https://github.com/zubir2k/homeassistant-spfm" target="_blank" rel="noopener">
          zubir2k/homeassistant-spfm
        </a>
        (<code>main</code>) showing all 3 single-purpose cards (<strong>Visitors</strong>,
        <strong>Announcements &amp; Notices</strong>, and <strong>Bill</strong>). Try approving
        or rejecting the waiting visitor!
      </p>
      <p style="margin-top: 0.85rem; margin-bottom: 0.35rem; font-size: 0.85rem;">Add to your Home Assistant via Marketplace/HACS:</p>
      <p style="margin-top: 0;">
        <a
          href="https://my.home-assistant.io/redirect/hacs_repository/?owner=zubir2k&repository=homeassistant-spfm&category=integration"
          target="_blank"
          rel="noopener"
        >
          <img
            src="https://my.home-assistant.io/badges/hacs_repository.svg"
            alt="Open your Home Assistant instance and open a repository inside the Home Assistant Community Store."
          />
        </a>
      </p>
    </header>

    <ha-embed-provider id="spfm-provider">
      <script id="entities-json" type="application/json">
        {
          "devices": [
            {
              "id": "spfm_unit_1",
              "name": "A-10-01"
            }
          ],
          "entities": [
            {
              "entity_id": "sensor.spfm_pending_visitors",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "1",
              "attributes": {
                "friendly_name": "Pending Visitors",
                "unit_id": "unit_101",
                "visitors": [
                  {
                    "id": "v_101",
                    "name": "Muhammad Hafiz",
                    "type": "DELIVERY",
                    "company": "Lalamove",
                    "vehicle": "VFX 2381"
                  }
                ]
              }
            },
            {
              "entity_id": "sensor.spfm_upcoming_visitors",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "3",
              "attributes": {
                "friendly_name": "Upcoming Visitors",
                "visitors": [
                  {
                    "id": "v_102",
                    "name": "Tan Wei Ming",
                    "type": "CONTRACTOR",
                    "vehicle": "WVC 5512",
                    "scan_in": "__TODAY_1012__"
                  },
                  {
                    "id": "v_103",
                    "name": "Nurul Aini",
                    "type": "RELATIVES & FRIENDS",
                    "purpose": "Family visit",
                    "datetime": "__TOMORROW_1530__"
                  },
                  {
                    "id": "v_104",
                    "name": "Ahmad Fauzi",
                    "type": "OVERNIGHT PARKING",
                    "purpose": "Overnight stay",
                    "datetime": "__IN_3D_2000__"
                  }
                ]
              }
            },
            {
              "entity_id": "sensor.spfm_latest_announcement",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "Water Supply Interruption",
              "attributes": {
                "friendly_name": "Announcements",
                "announcements": [
                  {
                    "title": "Water Supply Interruption",
                    "published": "__HOURS_AGO_6__",
                    "pdf_url": "https://github.com/zubir2k/homeassistant-spfm",
                    "notice": true
                  },
                  {
                    "title": "Enhancement works at Level 2A carpark exit",
                    "published": "__DAYS_AGO_1__",
                    "notice": false
                  },
                  {
                    "title": "Fogging Activity",
                    "published": "__DAYS_AGO_6__",
                    "pdf_url": "https://github.com/zubir2k/homeassistant-spfm",
                    "notice": true
                  }
                ]
              }
            },
            {
              "entity_id": "sensor.spfm_active_announcements",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "1",
              "attributes": {
                "friendly_name": "Notices",
                "list_url": "https://github.com/zubir2k/homeassistant-spfm",
                "announcements": [
                  {
                    "title": "Notice of Annual General Meeting (AGM)",
                    "published": "__DAYS_AGO_1__",
                    "active": true,
                    "pdf_url": "https://github.com/zubir2k/homeassistant-spfm"
                  }
                ]
              }
            },
            {
              "entity_id": "sensor.spfm_outstanding_balance",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "183.25",
              "attributes": {
                "friendly_name": "Outstanding Balance",
                "pay_url": "https://github.com/zubir2k/homeassistant-spfm",
                "bills": [
                  {
                    "reference_no": "JKRIV2611000001",
                    "date": "__BILL_DATE__",
                    "type": "BILL",
                    "pdf_path": "/api/spfm/invoice/JKRIV2611000001.pdf",
                    "items": [
                      { "item": "Charges", "amount": 166.6 },
                      { "item": "Sinking Fund", "amount": 16.65 }
                    ]
                  }
                ]
              }
            },
            {
              "entity_id": "sensor.spfm_next_due_date",
              "platform": "spfm",
              "device_id": "spfm_unit_1",
              "state": "__DUE_DATE__",
              "attributes": {
                "friendly_name": "Next Due Date"
              }
            }
          ]
        }
      </script>
      <script>
        (function () {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, "0");
          const dStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          const today = dStr(now);
          const tom = new Date(now.getTime() + 86400000);
          const in3d = new Date(now.getTime() + 3 * 86400000);
          const due = new Date(now.getTime() + 5 * 86400000);
          const bill = new Date(now.getFullYear(), now.getMonth(), 1);
          const el = document.getElementById("entities-json");
          el.textContent = el.textContent
            .replace(/__TODAY_1012__/g, `${today}T10:12:00+08:00`)
            .replace(/__TOMORROW_1530__/g, `${dStr(tom)}T15:30:00+08:00`)
            .replace(/__IN_3D_2000__/g, `${dStr(in3d)}T20:00:00+08:00`)
            .replace(/__HOURS_AGO_6__/g, new Date(now.getTime() - 6 * 3600000).toISOString())
            .replace(/__DAYS_AGO_1__/g, new Date(now.getTime() - 1 * 86400000).toISOString())
            .replace(/__DAYS_AGO_6__/g, new Date(now.getTime() - 6 * 86400000).toISOString())
            .replace(/__BILL_DATE__/g, dStr(bill))
            .replace(/__DUE_DATE__/g, dStr(due));
        })();
      </script>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:spfm-visitors-card
          device: spfm_unit_1
        </script>
      </ha-embed-card>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:spfm-updates-card
          device: spfm_unit_1
        </script>
      </ha-embed-card>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:spfm-bill-card
          device: spfm_unit_1
        </script>
      </ha-embed-card>
    </ha-embed-provider>

    <script type="module">
      await customElements.whenDefined("ha-embed-provider");
      const provider = document.getElementById("spfm-provider");
      await provider.updateComplete;

      const origCallService = provider.hass.callService.bind(provider.hass);
      provider.hass.callService = async (domain, service, data, target) => {
        if (domain === "spfm" && (service === "approve_visitor" || service === "reject_visitor")) {
          const pendingMock = provider.hass.mockEntities["sensor.spfm_pending_visitors"];
          const upcomingMock = provider.hass.mockEntities["sensor.spfm_upcoming_visitors"];
          const curPending = pendingMock?.attributes?.visitors || [];
          const visitor = curPending.find((v) => String(v.id) === String(data?.visitor_id));
          const nextPending = curPending.filter((v) => String(v.id) !== String(data?.visitor_id));
          pendingMock.update({
            state: String(nextPending.length),
            attributes: { visitors: nextPending },
          });
          if (service === "approve_visitor" && visitor) {
            const curUpcoming = upcomingMock?.attributes?.visitors || [];
            const nextUpcoming = [
              { ...visitor, scan_in: new Date().toISOString() },
              ...curUpcoming,
            ];
            upcomingMock.update({
              state: String(nextUpcoming.length),
              attributes: { visitors: nextUpcoming },
            });
          }
          return;
        }
        return origCallService(domain, service, data, target);
      };

      const origCallWS = provider.hass.callWS?.bind(provider.hass);
      provider.hass.callWS = async (msg) => {
        if (msg?.type === "auth/sign_path") {
          return { path: "https://github.com/zubir2k/homeassistant-spfm" };
        }
        return origCallWS ? origCallWS(msg) : {};
      };
    </script>
  </body>
</html>

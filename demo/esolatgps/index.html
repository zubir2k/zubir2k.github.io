<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eSolat GPS — Home Assistant Card Demo</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon.ico" sizes="32x32" />
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/home-assistant/home-assistant.io@current/source/images/favicon-192x192.png" />
    <script type="module" src="https://demo.home-assistant.io/embed.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-esolatgps@main/custom_components/esolatgps/frontend/esolatgps-card.js"
    ></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header { margin-bottom: 1.5rem; }
      .nav { font-size: 0.85rem; margin-bottom: 0.75rem; }
      .brand img { height: 40px; width: auto; display: block; margin-bottom: 0.35rem; }
      header p { margin: 0; opacity: 0.78; font-size: 0.95rem; }
      header a { color: #00a9a5; text-decoration: none; }
      header a:hover { text-decoration: underline; }
      ha-embed-provider { display: flex; flex-direction: column; gap: 16px; }
    </style>
  </head>
  <body>
    <header>
      <div class="nav"><a href="../">← All Card Demos</a></div>
      <div class="brand">
        <img
          src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-esolatgps@main/custom_components/esolatgps/brand/logo.png"
          alt="eSolat GPS"
        />
      </div>
      <p>
        Live interactive preview of
        <a href="https://github.com/zubir2k/homeassistant-esolatgps" target="_blank" rel="noopener">
          zubir2k/homeassistant-esolatgps
        </a>
        (<code>main</code>) running with mocked Home Assistant entities.
      </p>
      <p style="margin-top: 0.85rem; margin-bottom: 0.35rem; font-size: 0.85rem;">Add to your Home Assistant via Marketplace/HACS:</p>
      <p style="margin-top: 0;">
        <a
          href="https://my.home-assistant.io/redirect/hacs_repository/?owner=zubir2k&repository=homeassistant-esolatgps&category=integration"
          target="_blank"
          rel="noopener"
        >
          <img
            src="https://my.home-assistant.io/badges/hacs_repository.svg"
            alt="Open your Home Assistant instance and open a repository inside the Home Assistant Community Store."
          />
        </a>
      </p>
    </header>

    <ha-embed-provider>
      <script id="entities-json" type="application/json">
        [
          {
            "entity_id": "sensor.esolat_home",
            "state": "SGR01 · Kajang, Selangor",
            "attributes": {
              "friendly_name": "eSolat Home",
              "timezone": "Asia/Kuala_Lumpur",
              "imsak": "__TODAY__T05:38:00+08:00",
              "subuh": "__TODAY__T05:48:00+08:00",
              "syuruk": "__TODAY__T06:58:00+08:00",
              "zohor": "__TODAY__T13:06:00+08:00",
              "asar": "__TODAY__T16:28:00+08:00",
              "maghrib": "__TODAY__T19:03:00+08:00",
              "isyak": "__TODAY__T20:17:00+08:00"
            }
          },
          {
            "entity_id": "sensor.esolatnow",
            "state": "Asar",
            "attributes": {
              "friendly_name": "Waktu Solat Sekarang",
              "hijri": "16 Jamadilakhir 1448H"
            }
          }
        ]
      </script>
      <script>
        (function () {
          const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Kuala_Lumpur",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(new Date());
          const el = document.getElementById("entities-json");
          el.textContent = el.textContent.replace(/__TODAY__/g, parts);
        })();
      </script>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:esolatgps-card
          entity: sensor.esolat_home
          theme: sky
          language: ms
          layout: compact
          show_clock: true
          show_moon: true
          show_location: true
          show_slides: true
        </script>
      </ha-embed-card>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:esolatgps-card
          entity: sensor.esolat_home
          theme: sky
          language: ms
          layout: full
          show_clock: true
          show_imsak: true
          show_syuruk: true
          show_moon: true
          show_location: true
          show_slides: true
        </script>
      </ha-embed-card>
    </ha-embed-provider>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Hadith — Home Assistant Card Demo</title>
    <link rel="icon" type="image/png" href="https://zubir.tech/assets/img/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://zubir.tech/assets/img/favicons/favicon.svg" />
    <link rel="shortcut icon" href="https://zubir.tech/assets/img/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://zubir.tech/assets/img/favicons/apple-touch-icon.png" />
    <script type="module" src="https://demo.home-assistant.io/embed.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-dailyhadith@main/custom_components/daily_hadith/frontend/daily-hadith-card.js"
    ></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header { margin-bottom: 1.5rem; }
      .nav { font-size: 0.85rem; margin-bottom: 0.75rem; }
      .brand img { height: 40px; width: auto; display: block; margin-bottom: 0.35rem; }
      header p { margin: 0; opacity: 0.78; font-size: 0.95rem; }
      header a { color: #00a9a5; text-decoration: none; }
      header a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <div class="nav"><a href="../">← All Card Demos</a></div>
      <div class="brand">
        <picture>
          <source
            media="(prefers-color-scheme: dark)"
            srcset="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-dailyhadith@main/custom_components/daily_hadith/brand/dark_logo.png"
          />
          <img
            src="https://cdn.jsdelivr.net/gh/zubir2k/homeassistant-dailyhadith@main/custom_components/daily_hadith/brand/logo.png"
            alt="Daily Hadith"
          />
        </picture>
      </div>
      <p>
        Live interactive preview of
        <a href="https://github.com/zubir2k/homeassistant-dailyhadith" target="_blank" rel="noopener">
          zubir2k/homeassistant-dailyhadith
        </a>
        (<code>main</code>) running with mocked Home Assistant entities.
      </p>
      <p style="margin-top: 0.85rem; margin-bottom: 0.35rem; font-size: 0.85rem;">Add to your Home Assistant via Marketplace/HACS:</p>
      <p style="margin-top: 0;">
        <a
          href="https://my.home-assistant.io/redirect/hacs_repository/?owner=zubir2k&repository=homeassistant-dailyhadith&category=integration"
          target="_blank"
          rel="noopener"
        >
          <img
            src="https://my.home-assistant.io/badges/hacs_repository.svg"
            alt="Open your Home Assistant instance and open a repository inside the Home Assistant Community Store."
          />
        </a>
      </p>
    </header>

    <ha-embed-provider>
      <script type="application/json">
        [
          {
            "entity_id": "sensor.daily_hadith",
            "state": "2026-11-26",
            "attributes": {
              "friendly_name": "Daily Hadith",
              "title": "Actions are by intentions",
              "title_translation": "Amalan bergantung pada niat",
              "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى",
              "text": "Narrated 'Umar bin Al-Khattab: I heard Allah's Messenger (ﷺ) saying, \"The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended.\" [Al-Bukhari].",
              "translation": "Daripada Umar bin Al-Khattab r.a., beliau berkata: Aku mendengar Rasulullah ﷺ bersabda: \"Sesungguhnya setiap amalan itu bergantung pada niat, dan sesungguhnya bagi setiap orang apa yang dia niatkan.\" [Al-Bukhari].",
              "translation_language": "ms",
              "translation_source": "ai",
              "collection": "bukhari",
              "hadith_number": "1",
              "url": "https://sunnah.com/bukhari:1"
            }
          }
        ]
      </script>

      <ha-embed-card>
        <script type="text/yaml">
          type: custom:daily-hadith-card
          entity: sensor.daily_hadith
          language: auto
          show_arabic: true
          show_translation: true
          show_toggle: true
          show_header: true
          show_reference: true
          show_refresh: true
          show_copy: true
        </script>
      </ha-embed-card>
    </ha-embed-provider>
  </body>
</html>
